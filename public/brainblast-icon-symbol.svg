<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">BrainBlast symbol icon</title>
  <desc id="desc">A brain and lightning symbol on a dark rounded-square background, with no text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090f28"/>
      <stop offset="100%" stop-color="#151f47"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#ff6fd2" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff6fd2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb0eb"/>
      <stop offset="100%" stop-color="#e24fb0"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd08d"/>
      <stop offset="100%" stop-color="#f08f39"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <circle cx="256" cy="214" r="166" fill="url(#glow)"/>

  <g transform="translate(256 236)">
    <ellipse cx="0" cy="-26" rx="94" ry="74" fill="url(#brain)"/>
    <circle cx="-44" cy="-48" r="26" fill="#ffc2ef"/>
    <circle cx="8" cy="-56" r="24" fill="#ffc2ef"/>
    <circle cx="46" cy="-28" r="22" fill="#ffa5e4"/>
    <circle cx="-12" cy="-16" r="20" fill="#f985ce"/>
    <circle cx="-52" cy="-8" r="18" fill="#f985ce"/>
    <rect x="-10" y="40" width="20" height="34" rx="10" fill="#c63f95"/>

    <path d="M20 8L-6 52h24l-16 44 54-62H30l22-42z" fill="url(#bolt)" stroke="#ffe1b8" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <g stroke="#ff9fe3" stroke-width="9" stroke-linecap="round" opacity="0.75">
    <line x1="104" y1="190" x2="142" y2="204"/>
    <line x1="408" y1="190" x2="370" y2="204"/>
    <line x1="90" y1="252" x2="134" y2="252"/>
    <line x1="422" y1="252" x2="378" y2="252"/>
    <line x1="126" y1="320" x2="160" y2="304"/>
